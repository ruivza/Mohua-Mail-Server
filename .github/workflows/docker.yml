name: Test and publish Mohua image
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mohua_test
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: mohua_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mohua_test -d mohua_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://mohua_test:ci-test-password@localhost:5432/mohua_test
      - name: Validate image deployment configuration
        run: docker compose -f compose.image.yaml config --quiet
        env:
          MOHUA_IMAGE: ghcr.io/example/mohua:ci
          POSTGRES_PASSWORD: ci-test-password
          SETUP_TOKEN: ci-setup-token
          MAIL_BROKER_TOKEN: ci-only-mail-broker-token-at-least-32-characters
      - run: npm run export:server
      - name: Package deployment files
        run: tar -czf dist/mohua-server.tar.gz -C dist mohua-server
      - uses: actions/upload-artifact@v4
        with:
          name: mohua-server-package
          path: dist/mohua-server.tar.gz
          retention-days: 14
  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
            type=ref,event=pr
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
