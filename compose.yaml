name: mohua
services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mohua
      POSTGRES_USER: mohua
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/configure.mjs first}
    volumes:
      - mohua-postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mohua -d mohua']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
  server:
    build:
      context: .
      target: runtime
    image: mohua-server:local
    environment:
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: mohua
      PGUSER: mohua
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/configure.mjs first}
      SETUP_TOKEN: ${SETUP_TOKEN:?Run node scripts/configure.mjs first}
      OFFICIAL_PUSH_GATEWAY_URL: ${OFFICIAL_PUSH_GATEWAY_URL:-}
    depends_on:
      database:
        condition: service_healthy
        restart: true
    ports:
      - '${MOHUA_BIND_ADDRESS:-127.0.0.1}:${MOHUA_PORT:-3210}:3210'
    volumes:
      - mohua-keys:/app/keys
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3210/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
volumes:
  mohua-postgres:
  mohua-keys:
