worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  resolver 127.0.0.11 valid=5s ipv6=off;
  server {
    listen 8080;
    client_max_body_size 37m;
    client_body_timeout 600s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    set $control server:3210;
    set $mail mail-worker:3211;
    location ^~ /internal/ { return 404; }
    location = /healthz { proxy_pass http://$mail; }
    location ~ ^/api/(outbox(/|$)|accounts/[^/]+/(credential|folders|messages|sync|sync-mode|drafts|outbox|verify)(/|$)) {
      proxy_pass http://$mail;
    }
    location / { proxy_pass http://$control; }
  }
}
